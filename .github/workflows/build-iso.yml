name: Build Enclave ISO

# Builds the Enclave OS ISO (Hyprland session, Enclave Shell) in an Arch
# container. A pushed tag v* also publishes a GitHub Release with the ISO;
# a manual run only uploads it as a workflow artifact.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Static checks (all phases)
        run: for p in 0 1 2 3 4 5 6; do bash "tests/phase$p-asserts.sh" || exit 1; done

      # The runner starts with ~14 GB free; the ISO build (Calamares compile,
      # airootfs, squashfs) needs more. Drop toolchains the build never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          sudo docker image prune --all --force || true
          df -h /

      # Also builds the netboot ISO (a few MB, iPXE): it downloads
      # dist/netboot/* from this tag's release, so those are published too.
      - name: Build ISO (in archlinux container)
        env:
          NETBOOT_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/
        run: |
          docker run --rm --privileged \
            -v "$PWD":/enclave -w /enclave \
            -e ENCLAVE_NETBOOT_URL="$NETBOOT_URL" \
            archlinux:latest bash -c '
              sed -i "/^\[options\]/a XferCommand = /usr/bin/curl -fL -C - --retry 30 --retry-delay 3 --retry-all-errors --connect-timeout 30 -o %o %u" /etc/pacman.conf &&
              pacman -Syu --noconfirm --needed archiso git base-devel sudo sassc librsvg plymouth gtk-update-icon-cache cmake wlr-protocols wayland-protocols qt6-base qt6-declarative qt6-wayland qt6-svg layer-shell-qt qtermwidget grub inter-font ttf-jetbrains-mono ipxe mtools dosfstools libisoburn &&
              bash scripts/build-iso.sh'
          sudo chown -R "$(id -u):$(id -g)" dist
          ls -la dist/ dist/netboot/

      # GitHub release assets are limited to 2 GiB each: a larger ISO is
      # published in parts (join with: cat enclave-*.iso.part-* > enclave.iso).
      - name: Checksums (and split if over 2 GiB)
        run: |
          cd dist
          iso=$(ls enclave-*.iso | grep -v netboot | head -n1)
          sha256sum "$iso" > "$iso.sha256"
          if [ "$(stat -c %s "$iso")" -ge 2000000000 ]; then
            split -b 1900M -d -a 2 "$iso" "$iso.part-"
            echo "SPLIT=1" >> "$GITHUB_ENV"
          fi
          echo "ISO=$iso" >> "$GITHUB_ENV"
          # the netboot ISO and the files it downloads (one asset each, < 2 GiB)
          mv netboot/* .
          for f in enclave-vmlinuz enclave-initramfs.img enclave-airootfs.sfs; do
            [ "$(stat -c %s "$f")" -lt 2147483648 ] || { echo "$f is over 2 GiB"; exit 1; }
          done
          sha256sum enclave-netboot.iso enclave-vmlinuz enclave-initramfs.img enclave-airootfs.sfs > enclave-netboot.sha256
          ls -la

      - name: Upload ISOs (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: enclave-iso
          path: dist/*.iso
          compression-level: 0
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          netboot="enclave-netboot.iso enclave-vmlinuz enclave-initramfs.img enclave-airootfs.sfs enclave-netboot.sha256"
          nbsize=$(du -h enclave-netboot.iso | cut -f1)
          if [ "${SPLIT:-0}" = 1 ]; then
            assets=$(ls "$ISO".part-* "$ISO.sha256")
            how="The ISO is over GitHub's 2 GiB per-file limit, so it comes in parts. Download every part, then join them:

          \`\`\`
          cat $ISO.part-* > $ISO
          sha256sum -c $ISO.sha256
          \`\`\`"
          else
            assets="$ISO $ISO.sha256"
            how="Check the download with \`sha256sum -c $ISO.sha256\`."
          fi
          cat > notes.md <<EOF
          Enclave OS $TAG — Enclave Shell on Hyprland (rounded windows, blur, animations).

          * Boot it from a USB stick (UEFI) or in a VM. **Virtual machines need 3D acceleration enabled** (VMware: *Accelerate 3D graphics*; VirtualBox: VMSVGA + 3D; QEMU: virtio-gpu-gl).
          * Install with **Install Enclave OS** on the desktop. **The installer needs internet**: it downloads the rest of the apps (Thunderbird, Media Player, Windows and Flatpak app support, fonts…) into the new system.

          **Two ways to start:**

          * **\`$ISO\`**: the full live ISO. $how
          * **\`enclave-netboot.iso\`** ($nbsize): a tiny boot disk that downloads the same live desktop from this release while it starts. Needs UEFI, a **wired** network connection and 4 GB of memory or more. You don't need to download \`enclave-vmlinuz\`, \`enclave-initramfs.img\` or \`enclave-airootfs.sfs\` yourself: the netboot ISO fetches them.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$TAG" $assets $netboot --title "Enclave OS $TAG" --notes-file notes.md --prerelease
