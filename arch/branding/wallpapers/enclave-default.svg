<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <defs>
    <!-- navy base (brand) -->
    <linearGradient id="base" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0e1626"/>
      <stop offset="0.55" stop-color="#111c30"/>
      <stop offset="1" stop-color="#0a111d"/>
    </linearGradient>
    <!-- soft orange glow, low-right -->
    <radialGradient id="glow" cx="0.72" cy="0.82" r="0.6">
      <stop offset="0" stop-color="#ff6b1a" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#ff6b1a" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ff6b1a" stop-opacity="0"/>
    </radialGradient>
    <!-- cool highlight, upper-left -->
    <radialGradient id="cool" cx="0.2" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#3b5a86" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#3b5a86" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.25"/>
    </radialGradient>
  </defs>

  <rect width="3840" height="2160" fill="url(#base)"/>
  <rect width="3840" height="2160" fill="url(#cool)"/>
  <rect width="3840" height="2160" fill="url(#glow)"/>

  <!-- faint oversized Enclave "C" perimeter, barely there -->
  <g transform="translate(1920 1080) scale(14) translate(-50 -50)" opacity="0.05">
    <path d="M66 12 A40 40 0 1 0 66 88" stroke="#9fb4cf" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="26" cy="50" r="7" fill="#ff6b1a"/>
  </g>

  <rect width="3840" height="2160" fill="url(#vign)"/>
</svg>
