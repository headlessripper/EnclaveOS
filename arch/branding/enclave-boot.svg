<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="0.6" stop-color="#101a2e"/>
      <stop offset="1" stop-color="#0a1018"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.42">
      <stop offset="0" stop-color="#ff6b1a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff6b1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="480" fill="url(#bg)"/>
  <rect width="640" height="480" fill="url(#glow)"/>

  <!-- Enclave official mark (white arcs + orange dot), centred -->
  <g transform="translate(320 150) scale(1.15) translate(-50 -50)">
    <path d="M66 12 A40 40 0 1 0 66 88" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M60 26 A26 26 0 1 0 60 74" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.35"/>
    <circle cx="26" cy="50" r="7" fill="#ff6b1a"/>
  </g>

  <text x="320" y="252" text-anchor="middle" fill="#F3F5F8"
        font-family="DejaVu Sans, Segoe UI, sans-serif" font-size="38" font-weight="500"
        letter-spacing="1.5">Enclave OS</text>
  <text x="320" y="282" text-anchor="middle" fill="#7f94ab"
        font-family="DejaVu Sans, Segoe UI, sans-serif" font-size="15"
        letter-spacing="3">WINDOWS-LIKE, YOURS</text>
</svg>
