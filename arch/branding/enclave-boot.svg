      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#101b2b"/>
      <stop offset="1" stop-color="#0a1018"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.5">
      <stop offset="0" stop-color="#ff7a3d" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/>
