<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <!-- Enclave OS — BIOS boot menu background (syslinux splash, 640x480),
       Enclave Ember: obsidian, a low ember horizon, the mark and wordmark.
       The menu entries are drawn by syslinux over the lower half. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0B0E"/>
      <stop offset="0.7" stop-color="#101114"/>
      <stop offset="1" stop-color="#1A120C"/>
    </linearGradient>
    <radialGradient id="glow" cx="320" cy="760" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0.6" stop-color="#FF7A1A" stop-opacity="0"/>
      <stop offset="0.645" stop-color="#FF7A1A" stop-opacity="0.10"/>
      <stop offset="0.66" stop-color="#FFD0A6" stop-opacity="0.55"/>
      <stop offset="0.675" stop-color="#FF7A1A" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FF7A1A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="320" cy="70" r="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF7A1A" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FF7A1A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="480" fill="url(#sky)"/>
  <rect width="640" height="480" fill="url(#halo)"/>
  <circle cx="320" cy="760" r="420" fill="url(#glow)"/>

  <!-- the Enclave mark (white arcs + ember dot) -->
  <g transform="translate(320 62) scale(0.72) translate(-50 -50)">
    <path d="M66 12 A40 40 0 1 0 66 88" stroke="#F5F3EF" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M60 26 A26 26 0 1 0 60 74" stroke="#F5F3EF" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.35"/>
    <circle cx="26" cy="50" r="7" fill="#FF7A1A"/>
  </g>

  <text x="320" y="132" text-anchor="middle" fill="#F5F3EF"
        font-family="Inter, DejaVu Sans, sans-serif" font-size="28" font-weight="600"
        letter-spacing="1">Enclave OS</text>
  <text x="320" y="153" text-anchor="middle" fill="#A7A39B"
        font-family="Inter, DejaVu Sans, sans-serif" font-size="11"
        letter-spacing="4">CREATE  ·  WORK  ·  EXPLORE</text>
</svg>
