# Enclave OS — live boot menu (UEFI, GRUB).
#
# Enclave boots UEFI only, into this one-entry menu in Enclave's own theme
# (themes/enclave, rendered by tools/make-boot-art.sh). mkarchiso fills in the
# %…% values. The menu starts Enclave OS by itself after a short countdown;
# "e" still edits the boot options for troubleshooting.

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod udf
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png

set enclave_theme="/boot/grub/themes/enclave"

# Graphics: prefer a crisp 1080p canvas, else whatever the firmware offers.
set gfxmode="1920x1080,1600x900,1366x768,1280x800,1280x720,auto"
if loadfont "${enclave_theme}/enclave-16.pf2"; then
    loadfont "${enclave_theme}/enclave-14.pf2"
    loadfont "${enclave_theme}/enclave-strong-20.pf2"
    loadfont "${enclave_theme}/enclave-mono-16.pf2"
    terminal_output gfxterm
    set theme="${enclave_theme}/theme.txt"
    export theme
else
    # No graphics: a plain but still Enclave-worded menu.
    terminal_output console
    set menu_color_normal=light-gray/black
    set menu_color_highlight=black/brown
fi

set default=enclave
set timeout=5
set timeout_style=menu

menuentry "Start Enclave OS" --class enclave --id enclave {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% quiet splash loglevel=3 rd.udev.log_level=3 rd.systemd.show_status=false systemd.show_status=false vt.global_cursor_default=0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}
