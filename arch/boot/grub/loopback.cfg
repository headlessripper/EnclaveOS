# Enclave OS — entry used when another GRUB boots this ISO file directly
# (https://www.supergrubdisk.org/wiki/Loopback.cfg). One entry, like the menu.

search --no-floppy --set=archiso_img_dev --file "${iso_path}"
probe --set archiso_img_dev_uuid --fs-uuid "${archiso_img_dev}"

set default=enclave
set timeout=5
set timeout_style=menu

menuentry "Start Enclave OS" --class enclave --id enclave {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" %KERNEL_PARAMS% quiet splash loglevel=3 rd.udev.log_level=3 rd.systemd.show_status=false systemd.show_status=false vt.global_cursor_default=0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}
