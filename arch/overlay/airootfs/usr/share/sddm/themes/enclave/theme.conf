[General]
# Background image (Enclave wallpaper, installed with the branding assets).
# If it fails to load, Main.qml falls back to a painted gradient, so the
# login is never blank.
background=/usr/share/enclave/wallpapers/enclave-login.svg
type=image

# Enclave accent (orange) used for focus, the sign-in button and the caret.
accentColor=#FF7A3D
backgroundFill=#0E1621
textColor=#F3F5F8
dimColor=#0A0F16

# Rounded, clean controls.
cornerRadius=10
avatarSize=120
fontSize=11
