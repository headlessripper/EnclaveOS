#  Enclave OS — picom: the Hyprland-style look on X11.
#  Rounded corners, soft shadows, fade animations, translucency and blur.
#  Tuned to stay usable on VMware's software GL; if it feels heavy, enabling
#  "Accelerate 3D graphics" in the VM (or lowering blur-strength) helps.

backend = "glx";
vsync = true;
use-damage = true;

# --- rounded corners ---
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'"
];

# --- soft shadows ---
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.35;
shadow-offset-x = -18;
shadow-offset-y = -18;
shadow-exclude = [
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# --- fade animations ---
fading = true;
fade-in-step = 0.045;
fade-out-step = 0.045;
fade-delta = 8;

# --- translucency ---
inactive-opacity = 0.97;
active-opacity = 1.0;
frame-opacity = 0.9;
inactive-opacity-override = false;
inactive-dim = 0.03;

# --- blur (frosted-glass behind translucent windows / menus) ---
blur-method = "dual_kawase";
blur-strength = 4;
blur-background = true;
blur-background-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Keep menus/tooltips crisp and animated.
wintypes:
{
  tooltip  = { fade = true; shadow = true; opacity = 0.98; focus = true; };
  dock     = { shadow = true; };
  popup_menu = { opacity = 0.97; shadow = true; };
  dropdown_menu = { opacity = 0.97; shadow = true; };
  dnd      = { shadow = false; };
};
