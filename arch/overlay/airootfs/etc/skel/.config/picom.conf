#  Enclave OS — picom compositor: soft shadows, rounded corners, gentle fades,
#  and frosted-glass blur behind the taskbar / translucent surfaces.
#  Windows 11 + macOS cues: 8px corners (square when maximized or fullscreen),
#  fully opaque windows (no see-through title bars, no dimming), crisp menus.
#
#  Launched by /usr/local/bin/enclave-compositor, which falls back to the
#  xrender backend (no blur) and then to xfwm4's own compositor if GLX is
#  unavailable (e.g. a VM without 3D acceleration).
#
#  Uses the picom v12+ `rules` syntax (picom 13 in the image).

backend = "glx";
vsync = true;
use-damage = true;

corner-radius = 8;

shadow = true;
shadow-radius = 22;
shadow-opacity = 0.26;
shadow-offset-x = -22;
shadow-offset-y = -16;

fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;
fade-delta = 6;

blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;

rules = (
  # Desktop background: no effects.
  { match = "window_type = 'desktop'";
    shadow = false; blur-background = false; corner-radius = 0; },

  # Taskbar: square edges and frosted blur behind it (the "Mica" look).
  { match = "window_type = 'dock'";
    corner-radius = 0; shadow = false; },

  # Menus and tooltips: rounded, crisp, quick.
  { match = "window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'menu'";
    corner-radius = 8; },
  { match = "window_type = 'tooltip'";
    corner-radius = 6; opacity = 0.97; },
  { match = "window_type = 'dnd'";
    shadow = false; },

  # Maximized / fullscreen windows sit square against the screen edges.
  { match = "_NET_WM_STATE@[*] = '_NET_WM_STATE_MAXIMIZED_VERT' && _NET_WM_STATE@[*] = '_NET_WM_STATE_MAXIMIZED_HORZ'";
    corner-radius = 0; },
  { match = "fullscreen";
    corner-radius = 0; shadow = false; },

  # Client-side-decorated (GTK header bar) windows draw their own shadow.
  { match = "_GTK_FRAME_EXTENTS@";
    shadow = false; blur-background = false; },

  # Enclave's floating bubble: pill-shaped, frosted.
  { match = "class_g = 'Enclave-bubble' || name = 'Enclave Bubble'";
    corner-radius = 22; },
)
