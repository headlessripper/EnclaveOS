# Enclave OS — LIVE-ONLY autologin into Enclave Shell (Wayland, Hyprland
# underneath; session file /usr/share/wayland-sessions/enclave.desktop).
# The installer (Calamares, enclave-cleanup module) deletes this file on the
# installed system, so a normal boot shows the Enclave greeter instead.
[Autologin]
User=enclave
Session=enclave.desktop
Relogin=false
