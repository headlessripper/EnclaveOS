# Enclave OS — LIVE-ONLY autologin into the Plasma 6 session.
# The installer (Calamares, enclave-cleanup module) deletes this file on the
# installed system, so a normal boot shows the Enclave greeter instead.
#
# Session defaults to X11 (plasmax11.desktop), not Wayland. VMware/VirtualBox
# virtual GPUs don't give KWin-Wayland a working display, which shows up as a
# black screen after login. The X11 session renders reliably in VMs (and falls
# back to software compositing when 3D accel is off). Users can still pick the
# Wayland session from the greeter's session menu.
[Autologin]
User=enclave
Session=plasmax11.desktop
Relogin=false
