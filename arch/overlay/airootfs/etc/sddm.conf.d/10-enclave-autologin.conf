# Enclave OS — LIVE-ONLY autologin into the Plasma 6 session.
# The installer (Calamares, enclave-cleanup module) deletes this file on the
# installed system, so a normal boot shows the Enclave greeter instead.
#
# Plasma 6.8 on Arch is Wayland-only — the X11 session was removed upstream, so
# plasma.desktop (Wayland) is the only session. VMware's virtual GPU can't give
# KWin-Wayland a hardware GL context (black screen), so the image forces
# software GL (llvmpipe) via /etc/environment, which lets KWin composite in a VM.
[Autologin]
User=enclave
Session=plasma.desktop
Relogin=false
