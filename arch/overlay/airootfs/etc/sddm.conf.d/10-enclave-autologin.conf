# Enclave OS — LIVE-ONLY autologin into the XFCE session.
# The installer (Calamares, enclave-cleanup module) deletes this file on the
# installed system, so a normal boot shows the Enclave greeter instead.
#
# XFCE is an X11 desktop (xfce.desktop, provided by xfce4-session). X11 renders
# reliably on VMware's virtual GPU via Xorg's modesetting driver — no Wayland,
# no black screen.
[Autologin]
User=enclave
Session=xfce.desktop
Relogin=false
