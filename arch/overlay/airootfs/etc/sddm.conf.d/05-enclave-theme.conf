# Enclave OS — SDDM look (greeter theme). Kept on BOTH the live medium and the
# installed system, so the Enclave login screen is always used. The live-only
# autologin lives in 10-enclave-autologin.conf, which the installer removes.
[Theme]
Current=enclave

[General]
# Run the greeter under X11, not Wayland. SDDM's Wayland greeter needs a working
# KWin-Wayland display, which VMware/VBox virtual GPUs don't provide — it shows
# up as a black screen at the login screen. X11 renders reliably in VMs.
DisplayServer=x11
