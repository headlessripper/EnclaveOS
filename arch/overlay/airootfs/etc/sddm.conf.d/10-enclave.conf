# Enclave OS — live autologin into the Plasma 6 Wayland session.
# On an installed system this file is removed so the greeter is shown.
[Autologin]
User=enclave
Session=plasma.desktop
Relogin=false

[Theme]
# Enclave's own greeter (clean, Windows-familiar). Lives at
# /usr/share/sddm/themes/enclave.
Current=enclave

[General]
# Prefer the Wayland session; Plasma 6 ships plasma.desktop under
# /usr/share/wayland-sessions/.
GreeterEnvironment=QT_WAYLAND_DISABLE_WINDOWDECORATION=1
