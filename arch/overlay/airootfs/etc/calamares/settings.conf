# Enclave OS — Calamares installer configuration.
# Installs the running live system to disk: partition, copy the squashfs,
# create the user, install GRUB, then strip the live-only bits.
---
modules-search: [ local ]

instances:
- id:     prepare
  module: shellprocess
  config: shellprocess-prepare.conf
- id:     cleanup
  module: shellprocess
  config: shellprocess-cleanup.conf
# Netinstall: the ISO carries only the live desktop; the apps in
# packages.netinstall are downloaded into the new system (packages module).
- id:     netprep
  module: shellprocess
  config: shellprocess-netprep.conf
- id:     netdone
  module: shellprocess
  config: shellprocess-netdone.conf

sequence:
- show:
  - welcome
  - localeq
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - localeq
  - keyboard
  - localecfg
  - users
  - networkcfg
  - shellprocess@netprep
  - packages
  - shellprocess@netdone
  - hwclock
  - services-systemd
  - displaymanager
  - shellprocess@prepare
  - initcpiocfg
  - initcpio
  - grubcfg
  - bootloader
  - shellprocess@cleanup
  - umount
- show:
  - finished

branding: enclave
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
