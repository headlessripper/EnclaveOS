# Enclave OS — Calamares installer configuration.
# Installs the running live system to disk: partition, copy the squashfs,
# create the user, install GRUB, then strip the live-only bits.
---
modules-search: [ local ]

instances:
- id:     cleanup
  module: shellprocess
  config: shellprocess-cleanup.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - services-systemd
  - displaymanager
  - initcpiocfg
  - initcpio
  - grubcfg
  - bootloader
  - shellprocess@cleanup
  - umount
- show:
  - finished

branding: enclave
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
