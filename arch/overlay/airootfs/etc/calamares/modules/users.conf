# The real account created on the installed system. wheel gives sudo (see the
# sudoers drop-in shipped in the image). "network" is intentionally omitted — it
# isn't a default Arch group and would fail group assignment.
---
defaultGroups:
  - wheel
  - video
  - audio
  - storage
  - power
  - lp
  - input
  - users
autologinGroup: autologin
sudoersGroup: wheel
setRootPassword: false
doAutologin: false
doReusePassword: false
availableShells: /bin/bash
# The live session's "enclave" account is deleted by the cleanup step after
# install, so it (and other system names) can't be chosen for the real one.
user:
  shell: /bin/bash
  forbidden_names: [ root, enclave, live, builder, nobody ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "${first}-pc"
  forbidden_names: [ localhost ]
avatarFilePath: ""
passwordRequirements:
  minLength: 1
  maxLength: -1
