# The real account created on the installed system. wheel gives sudo (see the
# sudoers drop-in shipped in the image). "network" is intentionally omitted — it
# isn't a default Arch group and would fail group assignment.
---
defaultGroups:
  - wheel
  - video
  - audio
  - storage
  - power
  - lp
  - input
  - users
autologinGroup: autologin
sudoersGroup: wheel
setRootPassword: false
doAutologin: false
doReusePassword: false
availableShells: /bin/bash
userShell: /bin/bash
avatarFilePath: ""
passwordRequirements:
  minLength: 1
  maxLength: -1
