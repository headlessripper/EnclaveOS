# Enclave OS — GRUB on the installed system: a quiet, quick boot straight
# into the Enclave splash. The menu stays hidden (hold Shift or press Esc
# during the two seconds to see it).
---
overwrite: false
prefer_grub_d: false
keep_distributor: false
always_use_defaults: true
kernel_params: [ "quiet", "splash", "loglevel=3", "rd.udev.log_level=3", "rd.systemd.show_status=false", "systemd.show_status=false", "vt.global_cursor_default=0" ]
defaults:
    GRUB_TIMEOUT: 2
    GRUB_TIMEOUT_STYLE: "hidden"
    GRUB_DEFAULT: "saved"
    # one "Advanced options" entry instead of every kernel variant
    GRUB_DISABLE_SUBMENU: false
    GRUB_TERMINAL_OUTPUT: "gfxterm"
    # Hidden by default; hold Esc (or Shift) at power-on for Enclave's themed
    # menu — the same look as the live boot menu (build-iso.sh installs it).
    GRUB_THEME: "/usr/share/grub/themes/enclave/theme.txt"
    GRUB_GFXMODE: "1920x1080,1600x900,1366x768,1280x720,auto"
    # keep GRUB's mode so the Enclave splash starts without a flicker
    GRUB_GFXPAYLOAD_LINUX: "keep"
    GRUB_DISABLE_RECOVERY: true
