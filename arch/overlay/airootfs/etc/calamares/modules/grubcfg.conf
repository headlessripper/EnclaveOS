# Enclave OS — GRUB on the installed system: boots like Windows. When Enclave
# is the only system on the machine there is no menu at all — straight into
# the Enclave splash (hold Esc or Shift at power-on to see the menu). When
# another system is installed, /etc/grub.d/45_enclave_options shows the menu
# for 5 seconds so you can choose. The menu is Enclave's own: "Enclave OS",
# any other system, and "More options" (the options bubble: Advanced options
# and UEFI Firmware Settings) — built by /etc/grub.d/10_enclave and
# 45_enclave_options (GRUB's 10_linux / 30_uefi-firmware are switched off).
---
overwrite: false
prefer_grub_d: false
keep_distributor: false
always_use_defaults: true
kernel_params: [ "quiet", "splash", "loglevel=3", "rd.udev.log_level=3", "rd.systemd.show_status=false", "systemd.show_status=false", "vt.global_cursor_default=0" ]
defaults:
    GRUB_TIMEOUT: 0
    GRUB_TIMEOUT_STYLE: "hidden"
    # (quoted: GRUB compares the literal text "false"; a YAML bool would be
    #  written as "False")
    # look for other systems; if any, the menu shows (45_enclave_options)
    GRUB_DISABLE_OS_PROBER: "false"
    GRUB_DEFAULT: "saved"
    # one "Advanced options" submenu (it lives in the options bubble)
    GRUB_DISABLE_SUBMENU: "false"
    GRUB_TERMINAL_OUTPUT: "gfxterm"
    # Hidden by default; hold Esc (or Shift) at power-on for Enclave's themed
    # menu — the same look as the live boot menu (build-iso.sh installs it).
    GRUB_THEME: "/usr/share/grub/themes/enclave/theme.txt"
    GRUB_GFXMODE: "1920x1080,1600x900,1366x768,1280x720,auto"
    # keep GRUB's mode so the Enclave splash starts without a flicker
    GRUB_GFXPAYLOAD_LINUX: "keep"
    GRUB_DISABLE_RECOVERY: "true"
