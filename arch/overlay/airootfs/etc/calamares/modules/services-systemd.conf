# Enable the installed system's services; turn off the live-only ones (the
# cleanup shellprocess also removes their files).
---
units:
  - name: sddm.service
    action: enable
    mandatory: false
  - name: NetworkManager.service
    action: enable
    mandatory: false
  - name: enclave-live-setup.service
    action: disable
    mandatory: false
  - name: enclave-flathub.service
    action: disable
    mandatory: false
