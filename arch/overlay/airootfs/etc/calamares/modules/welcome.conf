# Keep requirements light so it runs in a modest VM. Internet IS required: the
# ISO is a netinstall, the apps (packages.netinstall) are downloaded while installing.
---
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
requirements:
  requiredStorage: 12
  requiredRam: 2
  # the apps come from the Arch mirrors, so check those (any one answering is enough)
  internetCheckUrl:
    - https://geo.mirror.pkgbuild.com/
    - https://archlinux.org/
    - http://example.com
  check:
    - storage
    - ram
    - power
    - internet
    - root
  required:
    - storage
    - ram
    - root
    # the apps are downloaded while installing (netinstall: a small ISO)
    - internet
