# Keep requirements light so it runs in a modest VM. Internet is checked but not
# required (install works offline).
---
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
requirements:
  requiredStorage: 12
  requiredRam: 2
  check:
    - storage
    - ram
    - power
    - internet
    - root
  required:
    - storage
    - ram
    - root
