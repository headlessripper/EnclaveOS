# Runs in the target chroot BEFORE initcpiocfg/initcpio/bootloader: turn the
# copied live filesystem into something that can boot from disk.
#
#  * Kernel: mkarchiso moves the kernel out of the squashfs's /boot onto the
#    ISO, so the unpacked system has an empty /boot. The same kernel is still
#    at /usr/lib/modules/<ver>/vmlinuz — put it where linux.preset and GRUB
#    expect it.
#  * Initramfs: the live medium's /etc/mkinitcpio.conf.d/archiso.conf adds the
#    archiso boot hooks (find-the-ISO) and is read AFTER mkinitcpio.conf, so it
#    would override what initcpiocfg writes and the installed system would
#    look for the live medium at boot. Remove it.
#  * Boot menu: Enclave's /etc/grub.d/10_enclave and 45_enclave_options build
#    it (one "Enclave OS" entry + the options bubble, which holds every other
#    entry); enclave-grub-tidy switches GRUB's other generators off so
#    nothing is listed twice (the enclave-grub pacman hook re-runs it).
#  * pacman keyring: the live keyring lives on a tmpfs, so the installed system
#    needs its own before it can install or update anything.
---
dontChroot: false
timeout: 600
script:
  - "for k in /usr/lib/modules/*/vmlinuz; do [ -f \"$k\" ] && cp -f \"$k\" /boot/vmlinuz-linux; done"
  - "test -f /boot/vmlinuz-linux"
  - "rm -f /etc/mkinitcpio.conf.d/archiso.conf"
  - "sh /usr/local/bin/enclave-grub-tidy"
  - "pacman-key --init"
  - "pacman-key --populate archlinux"
