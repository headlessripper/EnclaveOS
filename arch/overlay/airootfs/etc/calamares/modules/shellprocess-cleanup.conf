# Runs in the target chroot after install: strip the live-only pieces so the
# installed system boots to the Enclave greeter (not autologin) and doesn't
# carry the live user or the installer.
---
dontChroot: false
timeout: 180
script:
  # Live autologin + passwordless sudo are live-medium conveniences only.
  - "rm -f /etc/sddm.conf.d/10-enclave-autologin.conf"
  - "rm -f /etc/sudoers.d/10-enclave-live"
  # Live setup/flathub services and their enablement symlinks.
  - "rm -f /etc/systemd/system/multi-user.target.wants/enclave-live-setup.service"
  - "rm -f /etc/systemd/system/multi-user.target.wants/enclave-flathub.service"
  # The live 'enclave' user (the installed account is created by Calamares).
  # NOTE: don't name your account 'enclave' during install.
  - "userdel -rf enclave || true"
  # Arch live-medium (releng) pieces that must not survive onto a real install:
  # root autologin on tty1, ssh root password login, a RAM-only journal,
  # no-suspend, mirror/keyring/speech live services, cloud-init, networkd.
  - "rm -rf /etc/systemd/system/getty@tty1.service.d"
  - "rm -f /etc/ssh/sshd_config.d/10-archiso.conf"
  - "rm -f /etc/systemd/system/multi-user.target.wants/sshd.service"
  - "rm -f /etc/systemd/journald.conf.d/volatile-storage.conf"
  - "rm -f /etc/systemd/logind.conf.d/do-not-suspend.conf"
  - "rm -f /etc/systemd/system/multi-user.target.wants/choose-mirror.service /etc/systemd/system/choose-mirror.service"
  - "rm -f /etc/systemd/system/multi-user.target.wants/pacman-init.service /etc/systemd/system/pacman-init.service"
  - "rm -f /etc/systemd/system/multi-user.target.wants/livecd-talk.service /etc/systemd/system/livecd-talk.service"
  - "rm -f /etc/systemd/system/sound.target.wants/livecd-alsa-unmuter.service /etc/systemd/system/livecd-alsa-unmuter.service"
  - "rm -f /etc/systemd/system/etc-pacman.d-gnupg.mount"
  - "rm -rf /etc/systemd/system/cloud-init.target.wants"
  - "rm -f /etc/systemd/system/network-online.target.wants/systemd-networkd-wait-online.service"
  - "rm -rf /etc/systemd/system/systemd-networkd-wait-online.service.d"
  - "rm -f /etc/systemd/network/20-ethernet.network /etc/systemd/network/20-wlan.network /etc/systemd/network/20-wwan.network"
  - "rm -f /root/.automated_script.sh /root/.zlogin"
  - "rm -f /usr/local/bin/choose-mirror /usr/local/bin/livecd-sound /usr/local/bin/Installation_guide /usr/local/bin/enclave-install"
  # The installer itself and its launchers don't belong on the installed system.
  - "rm -f /usr/share/applications/enclave-install.desktop"
  - "rm -f /etc/skel/Desktop/enclave-install.desktop"
  - "rm -f /root/Desktop/enclave-install.desktop"
  - "find /home -maxdepth 3 -name enclave-install.desktop -delete 2>/dev/null || true"
  - "rm -f /etc/initcpio/hooks/enclave_http /etc/initcpio/install/enclave_http"
  - "rm -rf /usr/share/enclave/netinstall"
  - "rm -rf /etc/calamares /usr/share/calamares"
  - "pacman -R --noconfirm calamares || true"
