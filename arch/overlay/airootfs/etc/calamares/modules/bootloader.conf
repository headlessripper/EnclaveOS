# GRUB on the target — works for both UEFI (VMware default) and BIOS.
---
efiBootLoader: "grub"
kernel: "/vmlinuz-linux"
img: "/initramfs-linux.img"
fallback: "/initramfs-linux-fallback.img"
timeout: "5"
bootloaderEntryName: "Enclave OS"
kernelLine: ", with Enclave"
fallbackKernelLine: ", with Enclave (fallback)"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootloaderId: "Enclave"
installEFIFallback: true
