# Enclave OS — the Location page (Calamares localeq). Its look is Enclave's
# own: branding/enclave/localeq.qml (a dot-matrix world map that works
# offline, city search, language and formats), found because qmlSearch
# looks in the branding folder first.
---
qmlSearch: both

# Until the user picks (or GeoIP answers), start in New York.
region: "America"
zone:   "New_York"

# Guess the time zone from the network when there is one.
geoip:
    style:    "json"
    url:      "https://geoip.kde.org/v1/calamares"
    selector: ""
