#
# Enclave OS — pacman.conf for the archiso build host/airootfs.
# Based on the default Arch pacman.conf, with [multilib] enabled so that
# Wine/Proton 32-bit dependencies resolve (Phase 2 universal apps).
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
CheckSpace
ParallelDownloads = 5
# Resilient downloader: Arch mirrors / CDNs intermittently stall or reset
# mid-transfer; retry hard and resume partials instead of aborting the build.
XferCommand = /usr/bin/curl -fL -C - --retry 20 --retry-delay 3 --retry-all-errors --connect-timeout 30 -o %o %u
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# --- Enclave debloat: don't extract weight the desktop never uses ---
NoExtract = usr/share/man/* usr/share/info/*
NoExtract = usr/share/doc/* usr/share/gtk-doc/*
NoExtract = usr/share/locale/* !usr/share/locale/en* !usr/share/locale/locale.alias
NoExtract = usr/share/vim/vim*/lang/*
NoExtract = usr/share/i18n/charmaps/* !usr/share/i18n/charmaps/UTF-8.gz
# keep: usr/share/licenses/* (legal), usr/share/help/en* (English help)

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

