# Enclave Shell session: screenshots/screen sharing via Hyprland's portal
# (or wlr's under labwc), everything else (file chooser, settings) via GTK.
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=hyprland;wlr
org.freedesktop.impl.portal.ScreenCast=hyprland;wlr
org.freedesktop.impl.portal.Inhibit=none
